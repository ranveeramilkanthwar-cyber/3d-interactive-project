<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_1 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_1" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_1');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D Human Vertebral Column / Spine with scroll/touch-driven inspection
const width = container.clientWidth || window.innerWidth || 390;
const height = container.clientHeight || window.innerHeight || 600;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 18);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.7);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight1.position.set(5, 10, 8);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x0284c7, 1.2);
dirLight2.position.set(-6, -8, -5);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0x00f0ff, 1.5, 30);
pointLight.position.set(0, 2, 5);
scene.add(pointLight);

// Group for the entire spine
const spineGroup = new THREE.Group();
scene.add(spineGroup);

// Materials for bone, intervertebral discs, and nervous spinal cord
const boneMaterial = new THREE.MeshPhongMaterial({
  color: 0xedf2f7,
  emissive: 0x0f172a,
  specular: 0x38bdf8,
  shininess: 40,
  flatShading: false
});

const discMaterial = new THREE.MeshPhongMaterial({
  color: 0x0284c7,
  emissive: 0x0369a1,
  transparent: true,
  opacity: 0.85,
  shininess: 70
});

const cordMaterial = new THREE.MeshPhongMaterial({
  color: 0x00f0ff,
  emissive: 0x00b4d8,
  shininess: 90
});

// Construct a detailed anatomical human spine assembly:
// Cervical (7), Thoracic (12), Lumbar (5), Sacrum/Coccyx unit
const totalVertebrae = 24;
const vertebraeMeshes = [];

for (let i = 0; i < totalVertebrae; i++) {
  const vGroup = new THREE.Group();
  
  // Progress from top (C1) to bottom (L5)
  const t = i / (totalVertebrae - 1);
  const yPos = 8.5 - (i * 0.7);
  
  // Natural S-curvature of human spine (Lordosis & Kyphosis)
  const zCurve = Math.sin(t * Math.PI * 2.2) * 1.3 - 0.4;
  
  // Scale increases from cervical to lumbar
  const scale = 0.55 + (t * 0.7);
  
  // 1. Vertebral Body (Centrum - cylindrical/kidney shape)
  const bodyGeo = new THREE.CylinderGeometry(0.7 * scale, 0.75 * scale, 0.35 * scale, 16);
  const bodyMesh = new THREE.Mesh(bodyGeo, boneMaterial);
  bodyMesh.rotation.y = Math.PI / 8;
  vGroup.add(bodyMesh);

  // 2. Intervertebral Disc underneath (cushion)
  if (i < totalVertebrae - 1) {
    const discGeo = new THREE.CylinderGeometry(0.68 * scale, 0.72 * scale, 0.14 * scale, 14);
    const discMesh = new THREE.Mesh(discGeo, discMaterial);
    discMesh.position.y = -0.24 * scale;
    vGroup.add(discMesh);
  }

  // 3. Spinous Process (the dorsal ridge/backbone protrusion users feel along their back)
  const spinousGeo = new THREE.ConeGeometry(0.24 * scale, 1.2 * scale, 8);
  const spinousMesh = new THREE.Mesh(spinousGeo, boneMaterial);
  spinousMesh.position.set(0, -0.15 * scale, -0.75 * scale);
  spinousMesh.rotation.x = -Math.PI / 2.3;
  vGroup.add(spinousMesh);

  // 4. Transverse Processes (left & right lateral wings)
  const transGeo = new THREE.BoxGeometry(1.6 * scale, 0.18 * scale, 0.3 * scale);
  const transMesh = new THREE.Mesh(transGeo, boneMaterial);
  transMesh.position.set(0, 0, -0.3 * scale);
  transMesh.rotation.z = Math.sin(i * 0.5) * 0.05;
  vGroup.add(transMesh);

  // 5. Vertebral Arch / Pedicles
  const archGeo = new THREE.TorusGeometry(0.42 * scale, 0.09 * scale, 6, 12, Math.PI * 1.1);
  const archMesh = new THREE.Mesh(archGeo, boneMaterial);
  archMesh.position.set(0, 0, -0.25 * scale);
  archMesh.rotation.x = Math.PI / 2;
  vGroup.add(archMesh);

  vGroup.position.set(0, yPos, zCurve);
  vGroup.userData = { index: i, baseY: yPos, baseZ: zCurve };
  vertebraeMeshes.push(vGroup);
  spineGroup.add(vGroup);
}

// Sacrum & Coccyx base unit
const sacrumGroup = new THREE.Group();
const sacrumGeo = new THREE.ConeGeometry(1.3, 2.4, 5);
const sacrumMesh = new THREE.Mesh(sacrumGeo, boneMaterial);
sacrumMesh.rotation.x = Math.PI + 0.35;
sacrumMesh.position.set(0, -9.2, 0.2);
sacrumGroup.add(sacrumMesh);
spineGroup.add(sacrumGroup);

// Internal glowing spinal cord running along dorsal canal
const curvePoints = [];
for (let i = 0; i < totalVertebrae; i++) {
  const t = i / (totalVertebrae - 1);
  const y = 8.5 - (i * 0.7);
  const z = (Math.sin(t * Math.PI * 2.2) * 1.3 - 0.4) - 0.25;
  curvePoints.push(new THREE.Vector3(0, y, z));
}
curvePoints.push(new THREE.Vector3(0, -9.0, 0.1));
const cordCurve = new THREE.CatmullRomCurve3(curvePoints);
const cordGeo = new THREE.TubeGeometry(cordCurve, 40, 0.08, 8, false);
const cordMesh = new THREE.Mesh(cordGeo, cordMaterial);
spineGroup.add(cordMesh);

// Floating glowing neural bio-particles along spine
const particleCount = 45;
const partGeo = new THREE.BufferGeometry();
const partPositions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  const t = Math.random();
  const pt = cordCurve.getPoint(t);
  partPositions[i * 3] = pt.x + (Math.random() - 0.5) * 1.4;
  partPositions[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.5;
  partPositions[i * 3 + 2] = pt.z + (Math.random() - 0.5) * 1.2;
}
partGeo.setAttribute('position', new THREE.BufferAttribute(partPositions, 3));
const partMat = new THREE.PointsMaterial({
  color: 0x38bdf8,
  size: 0.18,
  transparent: true,
  opacity: 0.8
});
const particles = new THREE.Points(partGeo, partMat);
spineGroup.add(particles);

// Interaction & Scroll Synchronization
let scrollProgress = 0;
let targetScrollProgress = 0;
let mouseX = 0;
let targetRotY = 0;

function updateScrollProgress() {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  if (maxScroll > 0) {
    targetScrollProgress = window.scrollY / maxScroll;
  }
}
window.addEventListener('scroll', updateScrollProgress, { passive: true });

// Touch / Mouse lateral drag for 360 degree spin
let isTouching = false;
let startX = 0;
window.addEventListener('pointerdown', (e) => {
  isTouching = true;
  startX = e.clientX;
});
window.addEventListener('pointermove', (e) => {
  if (isTouching) {
    const deltaX = (e.clientX - startX) * 0.01;
    targetRotY += deltaX;
    startX = e.clientX;
  }
});
window.addEventListener('pointerup', () => { isTouching = false; });
window.addEventListener('pointercancel', () => { isTouching = false; });

// Resize handling
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth || 390;
  const h = container.clientHeight || window.innerHeight || 600;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Animation Loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // Smooth lerp scroll progress
  scrollProgress += (targetScrollProgress - scrollProgress) * 0.08;

  // Move camera / spine along vertical axis to follow user scroll through Cervical -> Thoracic -> Lumbar -> Sacrum
  // When at top (scroll=0), focus on Cervical (y ~ 7)
  // When scrolled down, track down the spine to Lumbar/Sacrum (y ~ -8)
  const targetCamY = 7.0 - (scrollProgress * 15.0);
  camera.position.y += (targetCamY - camera.position.y) * 0.07;
  camera.lookAt(0, camera.position.y * 0.9, 0);

  // Rotation response
  spineGroup.rotation.y += (targetRotY + (Math.sin(time * 0.7) * 0.25) - spineGroup.rotation.y) * 0.05;
  
  // Gentle breathing / organic articulation of vertebrae
  vertebraeMeshes.forEach((v, idx) => {
    const wave = Math.sin(time * 2.0 + idx * 0.25) * 0.02;
    v.rotation.x = wave;
  });

  // Pulse disc glows
  discMaterial.opacity = 0.75 + Math.sin(time * 3.0) * 0.2;
  pointLight.position.y = camera.position.y + Math.sin(time) * 2;

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_1 -->
</body>
</html>
